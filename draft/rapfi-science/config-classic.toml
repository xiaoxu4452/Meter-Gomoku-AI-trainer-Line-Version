# Meter Gomoku - same as config.toml but with [model.evaluator] commented out,
# so the engine runs on classical evaluation only (Weights: classical).
# [SCI] Same scientific fixes as config.toml: official 260809 knots, upstream-safe hash default.

[requirement]
min_version = [0,43,3]

[general]
reload_config_each_move = false
clear_hash_after_config_loaded = false
default_thread_num = 1
message_mode = "normal"
coord_conversion_mode = "X_flipY"
default_candidate_range = "square3_line4"
memory_reserved_mb = 0
default_tt_size_kb = 32768

[model]
binary_file = "model260809.bin"
# [SCI] Official winrate calibration knots for model260809 (from rapfi-networks config-example).
value_readout_knots = [0.0, 0.6655556577647762, 1.3147595695713945, 2.6539860186512536, 4.91760799866031, 7.3644430081849706]
value_readout_knots_standard = [0.0, 0.5376945460648732, 1.2355266357499173, 2.82156114592412, 5.68564079623083, 7.323674507742356]
value_readout_knots_renju_black = [0.0, 0.5396545700569862, 1.1969488359289335, 2.773769303482245, 5.6805632983918555, 8.580906646954922]
value_readout_knots_renju_white = [0.0, 0.5407858527740186, 1.1381487167274864, 2.721783913646255, 5.6300009341782165, 8.7169953036721]

