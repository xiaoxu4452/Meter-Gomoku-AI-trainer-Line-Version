# Meter Gomoku - Rapfi engine config (NNUE weights, mix9svq).
# Weight mapping MUST keep one entry per rule, in this order:
#   FREESTYLE (RULE 0, our default) -> mix9svqfreestyle_bsmix
#   STANDARD  (RULE 1)              -> mix9svqstandard_bs15
#   RENJU     (RULE 2)              -> mix9svqrenju_bs15_black / _white
# mix9svqstandard_bs15 is not a FREESTYLE net (the engine refuses it for RULE 0), so
# keeping it as the first entry makes every entry incompatible with FREESTYLE and the
# engine prints "Evaluator mix9svq disabled: no compatible weight config found."
# once per search thread and silently falls back to the classical evaluation.
# Measured 2026-11-01: with the bs15-first mapping freestyle ran classical eval
# (depth 25 in 2.2s, eval -103, best H6); with this mapping freestyle loads the NNUE
# weights again (see notes below). Do not "optimise" this list without re-probing.
# Tuned vs upstream/reference: candidate range square3_line4, 512 MB hash.
# ★ 2026-11-01: advanced_stop_ratio / mate / singular / max_depth now match the
# Rapfi-YixinBoard reference package and upstream defaults (0.9 / 24 / 24 / 99).
# The host no longer rescales TIMEOUT_TURN, so the stop ratio MUST stay at the
# engine's own 0.9 (see [search.timectl] below).

[requirement]
min_version = [0,43,1]

[general]
reload_config_each_move = false
clear_hash_after_config_loaded = false
default_thread_num = 1
message_mode = "normal"
coord_conversion_mode = "X_flipY"
default_candidate_range = "square3_line4"
memory_reserved_mb = 0
default_tt_size_kb = 524288

[model]
binary_file = "model260809.bin"

[model.evaluator]
type = "mix9svq"
draw_black_winrate = 0.5
draw_ratio = 1.0

[[model.evaluator.weights]]
weight_file = "mix9svqfreestyle_bsmix.bin.lz4"

[[model.evaluator.weights]]
weight_file = "mix9svqstandard_bs15.bin.lz4"

[[model.evaluator.weights]]
weight_file_black = "mix9svqrenju_bs15_black.bin.lz4"
weight_file_white = "mix9svqrenju_bs15_white.bin.lz4"

[search]
aspiration_window = true
# ★ 2026-11-01（用户：「用 Rapfi-YixinBoard / dotb1ue/rapfi 的思路，不要自己发明」）：
#   与参考整合包 config.toml 完全一致（该文件是官方 0.43.01 在 YixinBoard 里实测的配置）：
#   mate / singular_root 都要继续验证 24 个迭代，而不是上游默认的 6/4 —— 这决定
#   「看到杀棋后是否还会因为验证不足而换手」的战术准确度。
num_iteration_after_mate = 24
num_iteration_after_singular_root = 24
max_search_depth = 99

[search.timectl]
match_space = 21.0
match_space_min = 7.0
average_branch_factor = 1.7
# ★ 2026-11-01：必须是官方默认 / 参考整合包的值 0.9（searchconfig.h:81）。
#   宿主不在协议层反算时间，这个比例直接决定「每手实际用掉多少 TIMEOUT_TURN」：
#   0.92 会让引擎比官方晚 2% 收手、最后一代迭代经常被切在半路（等于白烧），
#   0.9 才是官方与参考包实测的平衡点。
advanced_stop_ratio = 0.9
move_horizon = 64

[database]
enable_by_default = false
type = "yixindb"
url = "rapfi.db"

[database.yixindb]
compressed_save = true
save_on_close = true
num_backups_on_save = 2
ignore_corrupted = true

[database.search]
readonly_mode = true
query_ply = 3
pv_iter_per_ply_increment = 1
nonpv_iter_per_ply_increment = 2
pv_write_ply = 0
pv_write_min_depth = 25
write_value_range = 800
mate_write_ply = 0
mate_write_min_depth_exact = 24
mate_write_min_depth_nonexact = 24
mate_write_min_step = 0
exact_overwrite_ply = 100
nonexact_overwrite_ply = 0
overwrite_rule = "better_value_depth_bound"
overwrite_exact_bias = 4
overwrite_depth_bound_bias = -1
query_result_depth_bound_bias = 0

[database.libfile]
black_win_mark = "a"
white_win_mark = "c"
black_lose_mark = "c"
white_lose_mark = "a"
ignore_comment = false
